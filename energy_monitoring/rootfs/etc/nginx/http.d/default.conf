server {
    listen 8099 default_server;

    root /usr/share/www;
    index index.html;

    # Serve static files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API endpoint for configuration
    location /api/config {
        default_type application/json;
        alias /usr/share/www/config.json;
    }

    # Health check endpoint
    location /health {
        default_type application/json;
        return 200 '{"status": "healthy"}';
    }
}
